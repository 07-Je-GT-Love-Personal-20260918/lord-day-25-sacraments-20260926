name: Deploy Psalm 131 to Vercel
on:
  push:
    branches: [psalm-131-deploy-20260927]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_NAME: psalm-131-humble-children-20260927
      VERCEL_SCOPE: abners-projects-6f97a189
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure Vercel project exists
        run: |
          npx --yes vercel@60.1.3 project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 ||           npx --yes vercel@60.1.3 project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy static sermon to production
        run: |
          npx --yes vercel@60.1.3 deploy ps131-site --prod --yes --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
