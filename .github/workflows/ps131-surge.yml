name: Deploy Psalm 131 to Surge
on:
  push:
    branches: [psalm-131-deploy-20260927]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stage Psalm 131 static site
        run: |
          mkdir -p public
          cp ps131-site/index.html public/index.html
          cp ps131-site/index.html public/404.html
      - name: Publish on Surge
        run: npx --yes surge@0.44.4 public psalm-131-humble-children-20260927.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
