name: Deploy Psalm 131 to Surge
on:
  push:
    branches: [psalm-131-deploy-20260927]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve existing root and add Psalm 131 path
        run: |
          mkdir -p public/psalm131
          cp index.html public/index.html
          cp 404.html public/404.html
          cp ps131-site/index.html public/psalm131/index.html
      - name: Publish on the authorized Surge domain
        run: npx --yes surge@0.44.4 public lord-day-25-sacraments-20260926.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      - name: Verify the public Surge page
        run: |
          curl --fail --location --retry 5 --retry-delay 2 --max-time 30             https://lord-day-25-sacraments-20260926.surge.sh/psalm131/ -o /tmp/ps131.html
          grep -F '<title>作上帝谦卑的儿女｜诗篇131｜2026-09-27</title>' /tmp/ps131.html
          grep -F '七个讨论题：逐题参考答案与分析' /tmp/ps131.html
          grep -F '教学地图示意' /tmp/ps131.html
          test "$(wc -c < /tmp/ps131.html)" -gt 25000
