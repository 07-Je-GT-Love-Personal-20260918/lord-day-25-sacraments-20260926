name: Deploy to Surge
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare static files
        run: |
          mkdir -p public/psalm131
          cp index.html 404.html public/
          cp psalm131/index.html public/psalm131/index.html
          cp psalm131/404.html public/psalm131/404.html
      - name: Publish on Surge
        run: npx --yes surge@0.44.4 public lord-day-25-sacraments-20260926.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      - name: Verify Psalm 131 public page
        run: |
          curl --fail --location --retry 5 --retry-delay 2 --max-time 30             https://lord-day-25-sacraments-20260926.surge.sh/psalm131/ -o /tmp/ps131.html
          grep -F '<title>作上帝谦卑的儿女｜诗篇131｜2026-09-27</title>' /tmp/ps131.html
          grep -F '七个讨论题：逐题参考答案与分析' /tmp/ps131.html
