name: Create Psalm 131 repository
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-psalm131-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt organization repository creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/07-Je-GT-Love-Personal-20260918/repos \
            -d '{"name":"psalm-131-humble-children-20260927","description":"诗篇131｜作上帝谦卑的儿女｜2026-09-27","private":false,"auto_init":true}')
          echo "HTTP_STATUS=${code}"
          cat response.json
          test "${code}" = "201"
